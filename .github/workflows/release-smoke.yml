name: Release Smoke
run-name: ARM host startup diagnosis dcdf09a with tools 123a188374
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualification_native:
    name: Existing ARM consumer diagnostic (dcdf09a packages)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 123a18837478d8cd0e2aff23f7e7aa86c9107de3
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Bind corrected tooling independently of installed product
        env:
          TOOLING_SHA: 123a18837478d8cd0e2aff23f7e7aa86c9107de3
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TOOLING_SHA" ]] || exit 1
          [[ "$(node -p 'process.platform + "-" + process.arch')" == linux-arm64 ]] || exit 1
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/arm-diagnostic-identity.json', JSON.stringify({
            schema: 'paperclip.arm.installed-startup-diagnostic/v1', toolingSourceRevision: process.env.TOOLING_SHA,
            productSourceRevision: 'dcdf09a0f33536fa2b6daaf6e731d921d5711282', providerTurns: 0,
            buildOrPublishActions: 0, finalCandidateQualification: false,
          }, null, 2));
          NODE
      - name: Verify and reuse the exact completed package archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          #!/usr/bin/env bash
          # Temporary hosted-only diagnostic transfer; no build, publication, or provider.
          set -euo pipefail
          : "${RUNNER_TEMP:?Disposable hosted runner scratch is required}"
          : "${GH_TOKEN:?Read-only GitHub Actions token is required}"
          [[ "$RUNNER_TEMP" = /* ]] || exit 1
          transfer="$RUNNER_TEMP/arm-diagnostic-transfer"
          packages="$RUNNER_TEMP/public-runner-packs"
          [[ ! -e "$transfer" && ! -e "$packages" ]] || exit 1
          mkdir -m 700 "$transfer"
          trap 'rm -f "$transfer/public-packages.zip" "$transfer/materialize.py"' EXIT
          gh api repos/paperclipai/paperclip/actions/artifacts/11757308120 > "$transfer/artifact-metadata.json"
          gh api repos/paperclipai/paperclip/actions/artifacts/11757308120/zip > "$transfer/public-packages.zip"
          cat > "$transfer/materialize.py" <<'ARM_ARTIFACT_GUARD'
          #!/usr/bin/env python3
          """One diagnostic transfer of a previously qualified package graph; no execution."""
          import hashlib,json,os,pathlib,re,stat,sys,zipfile
          SOURCE='dcdf09a0f33536fa2b6daaf6e731d921d5711282'
          ARTIFACT=11757308120
          RUN=38268767165
          ZIP_SHA='59036218b785492804aafb59e8ec6d50fb92755de7ff0e73a2ddec8e1e3e131e'
          meta_path,zip_path,destination=map(pathlib.Path,sys.argv[1:])
          assert meta_path.stat().st_size<65536
          meta=json.loads(meta_path.read_text())
          assert meta['id']==ARTIFACT and meta['name']=='codex-four-targets-dcdf09a-20261012-public-packages'
          assert meta['expired'] is False and meta['digest']=='sha256:'+ZIP_SHA
          assert meta['workflow_run']['id']==RUN and meta['workflow_run']['head_sha']==SOURCE
          assert meta['workflow_run']['repository_id']==meta['workflow_run']['head_repository_id']==1170821064
          assert zip_path.stat().st_size==meta['size_in_bytes'] and zip_path.stat().st_size<200*1024*1024
          assert hashlib.sha256(zip_path.read_bytes()).hexdigest()==ZIP_SHA
          assert not destination.exists()
          with zipfile.ZipFile(zip_path) as archive:
              members=archive.infolist()
              assert len(members)==19
              names=[m.filename for m in members]
              assert len(set(names))==len(names) and 'manifest.json' in names
              assert sum(m.file_size for m in members)<200*1024*1024
              for m in members:
                  assert not m.is_dir() and '/' not in m.filename and '\\' not in m.filename
                  assert m.filename=='manifest.json' or re.fullmatch(r'[A-Za-z0-9._-]+\.tgz',m.filename)
                  assert m.file_size<200*1024*1024 and not (m.flag_bits&1)
                  assert m.compress_type in (zipfile.ZIP_STORED,zipfile.ZIP_DEFLATED)
                  kind=stat.S_IFMT(m.external_attr>>16)
                  assert kind in (0,stat.S_IFREG), 'non-regular artifact member'
              assert archive.getinfo('manifest.json').file_size<1024*1024
              manifest=json.loads(archive.read('manifest.json'))
              assert manifest['schema']=='paperclip.runner.public-packages/v1' and manifest['sourceRevision']==SOURCE
              records=manifest['archives']; assert len(records)==18
              assert len(set(r['name'] for r in records))==18
              assert {'paperclipai','@paperclipai/server'} <= set(r['name'] for r in records)
              assert set(names)=={'manifest.json',*(r['file'] for r in records)}
              for record in records:
                  assert re.fullmatch(r'[A-Za-z0-9._-]+\.tgz',record['file'])
                  assert re.fullmatch(r'[a-f0-9]{64}',record['sha256'])
                  assert hashlib.sha256(archive.read(record['file'])).hexdigest()==record['sha256']
              destination.mkdir(mode=0o700)
              for member in members:
                  output=destination/member.filename
                  with output.open('xb') as stream:stream.write(archive.read(member))
                  os.chmod(output,0o600)
          print(json.dumps({'schema':'paperclip.arm-diagnostic.artifact-transfer/v1','artifactId':ARTIFACT,'runId':RUN,
           'productSourceRevision':SOURCE,'zipSha256':ZIP_SHA,'packageCount':18,'boundedRegularMembersOnly':True,
           'packageContentHashesVerified':True,'executedPackageCode':False}))
          ARM_ARTIFACT_GUARD
          python3 "$transfer/materialize.py" "$transfer/artifact-metadata.json" "$transfer/public-packages.zip" "$packages" > "$RUNNER_TEMP/arm-diagnostic-artifact-transfer.json"
          cat "$RUNNER_TEMP/arm-diagnostic-artifact-transfer.json"
          # Parent workflow next invokes the existing ARM consumer from a separately
          # recorded immutable corrected tooling checkout. The product SHA stays literal:
          # node scripts/verify-grok-npm-install.mjs --linux-arm64-consumer "$packages" \
          #   dcdf09a0f33536fa2b6daaf6e731d921d5711282 "$RUNNER_TEMP/native-public-install.json"
      - name: Install only existing verifier tooling
        run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Run existing clean ARM consumer with corrected diagnostics
        run: |
          set -euo pipefail
          node scripts/verify-grok-npm-install.mjs --linux-arm64-consumer \
            "$RUNNER_TEMP/public-runner-packs" dcdf09a0f33536fa2b6daaf6e731d921d5711282 \
            "$RUNNER_TEMP/native-public-install.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm-host-diagnostic-dcdf09a-tools-123a188374
          path: |
            ${{ runner.temp }}/arm-diagnostic-identity.json
            ${{ runner.temp }}/arm-diagnostic-artifact-transfer.json
            ${{ runner.temp }}/native-public-install.json
          if-no-files-found: error
          retention-days: 14
